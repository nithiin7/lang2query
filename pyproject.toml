[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lang2query"
version = "0.1.0"
description = "Natural language to SQL conversion using multi-agent LLM workflows"
requires-python = ">=3.10"
dependencies = [
    "transformers",
    "torch",
    "urllib3",
    "requests",
    "pydantic",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langchain-openai",
    "streamlit",
    "chromadb",
    "sentence-transformers",
    "sqlglot",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",  # Parallel test execution

    # Code quality
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",

    # Documentation
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",

    # Security
    "bandit>=1.7.5",
    "safety>=2.3.0",

    # Performance
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",

    # Development tools
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",

    # API testing
    "httpx>=0.24.0",
    "requests-mock>=1.11.0",

    # Database testing
    "pytest-postgresql>=5.0.0",
    "pytest-mysql>=2.0.0",

    # Mocking
    "freezegun>=1.2.0",
    "responses>=0.23.0",
]

[tool.setuptools]
packages = []

[tool.isort]
profile = "black"
